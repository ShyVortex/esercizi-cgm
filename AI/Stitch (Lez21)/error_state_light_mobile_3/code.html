<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-gutter h-16 max-w-container-max mx-auto bg-surface dark:bg-surface-dim shadow-sm">
<div class="flex items-center gap-sm">
<span class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim font-bold">BlogSpace</span>
</div>
<div class="flex items-center gap-md">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200 cursor-pointer active:scale-95 transition-transform text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200 cursor-pointer active:scale-95 transition-transform text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</div>
</header>
<!-- Main Content: Error State Canvas -->
<main class="flex-grow flex items-center justify-center px-gutter pt-xxxl pb-xl">
<div class="max-w-md w-full flex flex-col items-center text-center">
<!-- Error Illustration / Iconography Container -->
<div class="relative w-full aspect-square max-w-[280px] mb-xl flex items-center justify-center">
<!-- Background decorative element -->
<div class="absolute inset-0 bg-primary/5 rounded-full scale-90 blur-3xl"></div>
<!-- Main Error Visual -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-24 h-24 bg-error-container text-on-error-container rounded-full flex items-center justify-center mb-lg shadow-sm">
<span class="material-symbols-outlined text-[48px]" data-icon="wifi_off" style="font-variation-settings: 'wght' 300;">wifi_off</span>
</div>
<!-- Decorative subtle lines mimicking network waves breaking -->
<div class="flex gap-xs opacity-20">
<div class="w-1 h-8 bg-error rounded-full animate-pulse"></div>
<div class="w-1 h-12 bg-error rounded-full animate-pulse delay-75"></div>
<div class="w-1 h-8 bg-error rounded-full animate-pulse delay-150"></div>
</div>
</div>
</div>
<!-- Error Messaging -->
<h1 class="font-headline-sm-mobile text-headline-sm-mobile text-on-surface mb-md">
                Ops! Qualcosa è andato storto.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl px-4">
                Non siamo riusciti a caricare i post. Controlla la tua connessione e riprova tra un istante.
            </p>
<!-- Action Area -->
<div class="flex flex-col gap-md w-full">
<button class="h-12 w-full bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-sm shadow-md hover:bg-primary-container active:scale-95 transition-all duration-200" onclick="handleRetry()">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                    Riprova
                </button>
<button class="h-12 w-full border border-outline text-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-sm hover:bg-surface-container-low active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[20px]" data-icon="settings">settings</span>
                    Impostazioni di rete
                </button>
</div>
<!-- Subtle secondary hint -->
<div class="mt-xxl">
<div class="inline-flex items-center gap-xs px-md py-xs bg-surface-container-high rounded-full">
<span class="w-2 h-2 rounded-full bg-error animate-ping"></span>
<span class="font-label-md text-label-md text-on-surface-variant">Errore di rete: ERR_CONNECTION_REFUSED</span>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-xl px-gutter flex flex-col md:flex-row justify-between items-center gap-md max-w-container-max mx-auto bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline">
<div class="flex flex-col items-center md:items-start gap-xs">
<span class="font-title-lg text-title-lg text-on-surface dark:text-inverse-on-surface font-bold">BlogSpace</span>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant text-center md:text-left">
                © 2024 BlogSpace Editorial. All rights reserved.
            </p>
</div>
<nav class="flex flex-wrap justify-center gap-md">
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">Contact Us</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">About</a>
</nav>
</footer>
<!-- Micro-interaction for the retry button -->
<script>
        function handleRetry() {
            const btn = event.currentTarget;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Start spinning animation
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.disabled = true;
            
            // Mock recovery attempt
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                btn.disabled = false;
                // In a real app, this would trigger a re-fetch of the posts
                console.log('Retrying connection...');
            }, 1500);
        }
    </script>
</body></html>
