        }

            content: "";

            top: 0;
            right: 0;
            bottom: 0;

        // Micro-interaction for dark mode toggle (visual only for this prototype)
        const darkModeBtn = document.querySelector('[data-icon="dark_mode"]');
        darkModeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const icon = darkModeBtn.textContent.trim();
            darkModeBtn.textContent = icon === 'dark_mode' ? 'light_mode' : 'dark_mode';
