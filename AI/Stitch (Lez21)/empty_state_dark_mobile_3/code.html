<script>
        // Simple micro-interaction for the search bar
        const searchInput = document.querySelector('input');
        const clearBtn = searchInput.nextElementSibling.querySelector('button');

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.focus();
        });

        // Add subtle hover effect for suggested chips
        document.querySelectorAll('.rounded-pill').forEach(chip => {
            chip.addEventListener('mouseenter', () => {
                chip.style.transform = 'translateY(-2px)';
            });
            chip.addEventListener('mouseleave', () => {
                chip.style.transform = 'translateY(0)';
            });
        });
    </script>
