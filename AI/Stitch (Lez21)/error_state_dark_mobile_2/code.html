<style>
        body {
            background-color: #121212; /* Explicit Dark Mode Request */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .error-glow {
            background: radial-gradient(circle at center, rgba(186, 26, 26, 0.15) 0%, transparent 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="text-on-surface dark:text-[#e0e0e0] flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar Predicted Component -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-gutter h-16 max-w-container-max mx-auto bg-surface dark:bg-surface-dim shadow-sm md:shadow-md">
<div class="flex items-center gap-sm">
<span class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim font-bold">BlogSpace</span>
</div>
<div class="flex items-center gap-md">
<button class="cursor-pointer active:scale-95 transition-transform p-2 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="dark_mode">dark_mode</span>
</button>
<button class="md:hidden p-2 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="menu">menu</span>
</button>
</div>
</header>
<!-- Main Content Area: Error State -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter pt-xxl pb-xxl relative overflow-hidden">
<!-- Atmospheric Background Decoration -->
<div class="absolute inset-0 error-glow -z-10"></div>
<!-- Error Illustration/Icon -->
<div class="mb-xl animate-pulse">
<div class="w-24 h-24 rounded-full bg-error/10 flex items-center justify-center border-2 border-error/20">
<span class="material-symbols-outlined text-[64px] text-error" data-icon="signal_disconnected" style="font-variation-settings: 'wght' 300;">signal_disconnected</span>
</div>
</div>
<!-- Central Message -->
<div class="text-center max-w-xs mx-auto">
<h1 class="font-headline-sm-mobile text-headline-sm-mobile mb-md text-[#e0e0e0]">Connessione Fallita</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant dark:text-[#a0a0a0] mb-xl">Non è stato possibile caricare i contenuti. Controlla la tua rete e prova di nuovo.</p>
</div>
<!-- Action Button -->
<button class="group relative flex items-center justify-center gap-sm h-12 px-xl rounded-full bg-primary text-on-primary font-label-lg text-label-lg active:scale-95 transition-all duration-200 shadow-md hover:shadow-lg hover:bg-primary-container" id="retry-button">
<span class="material-symbols-outlined text-on-primary" data-icon="refresh">refresh</span>
<span>Riprova</span>
</button>
<!-- Secondary Guidance -->
<div class="mt-xxl flex flex-col gap-sm items-center">
<div class="flex gap-md">
<div class="p-4 rounded-xl bg-surface-container-highest/20 flex flex-col items-center border border-outline-variant/30 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary-fixed-dim mb-xs" data-icon="wifi_off">wifi_off</span>
<span class="font-label-md text-label-md text-[#a0a0a0]">Wi-Fi</span>
</div>
<div class="p-4 rounded-xl bg-surface-container-highest/20 flex flex-col items-center border border-outline-variant/30 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary-fixed-dim mb-xs" data-icon="cell_tower">cell_tower</span>
<span class="font-label-md text-label-md text-[#a0a0a0]">Dati</span>
</div>
</div>
</div>
</main>
<!-- Footer Predicted Component -->
<footer class="w-full py-xl px-gutter flex flex-col md:flex-row justify-between items-center gap-md max-w-container-max mx-auto bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline">
<div class="flex flex-col items-center md:items-start gap-xs">
<span class="font-title-lg text-title-lg text-on-surface dark:text-inverse-on-surface font-bold">BlogSpace</span>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant">© 2024 BlogSpace Editorial. All rights reserved.</p>
</div>
<nav class="flex flex-wrap justify-center gap-lg">
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">Contact Us</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all" href="#">About</a>
</nav>
</footer>
<!-- Interactive script for feedback -->
<script>
        document.getElementById('retry-button').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Visual feedback for click
            icon.style.transition = 'transform 0.5s ease-in-out';
            icon.style.transform = 'rotate(360deg)';
            
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
                <span>Connessione in corso...</span>
            `;
            
            // Simulate reload attempt
            setTimeout(() => {
                location.reload();
            }, 1500);
        });
    </script>
<!-- Background Elements -->
<div class="fixed top-1/4 -left-12 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-20"></div>
<div class="fixed bottom-1/4 -right-12 w-80 h-80 bg-tertiary/5 rounded-full blur-3xl -z-20"></div>
</body></html>
