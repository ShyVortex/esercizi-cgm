<!DOCTYPE html>

<html class="dark" lang="it"><head>

<style>

        }
        body {
            background-color: #121212;
            color: #f3f0f5;
        }
        .error-glitch-effect {
            animation: pulse-slow 4s infinite ease-in-out;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>

            darkMode: "class",

                extend: {

                        "surface-dim": "#121212",

                        "surface-container-lowest": "#1b1b1f",

                        "inverse-surface": "#f3f0f5",
                        "secondary-fixed-dim": "#bbc7db",
                        "surface-container-low": "#1b1b1f",

                        "on-secondary-fixed": "#101c2b",

                        "inverse-primary": "#005db5",

                        "on-primary-fixed-variant": "#00468b",
                        "inverse-on-surface": "#1b1b1f",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#52405b",
                        "tertiary-fixed": "#f3dafc",
                        "tertiary": "#d6bedf",
                        "surface-container-highest": "#33353a",
                        "on-secondary-fixed-variant": "#3c4858",
                        "on-secondary-container": "#d7e3f8",
                        "on-primary-container": "#cadcff",
                        "on-error": "#690005",
                        "on-background": "#e4e2e6",
                        "surface-container": "#1f1f23",

                    "fontFamily": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-dim min-h-screen flex flex-col font-body-md text-on-surface overflow-x-hidden">
<!-- TopNavBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-gutter h-16 max-w-container-max mx-auto bg-surface-dim shadow-sm">
<div class="flex items-center gap-md">
<span class="font-headline-sm text-headline-sm text-primary-fixed-dim font-bold">BlogSpace</span>
</div>
<div class="flex items-center gap-sm">
<button class="material-symbols-outlined p-base text-primary-fixed-dim hover:bg-surface-container-highest transition-colors duration-200 cursor-pointer active:scale-95" data-icon="dark_mode">dark_mode</button>
</div>
</header>
<!-- Main Content: Error State Canvas -->
<main class="flex-grow flex items-center justify-center px-gutter pt-xxl pb-xxl mt-16">
<div class="w-full max-w-md text-center flex flex-col items-center">
<!-- Visual Error Anchor -->
<div class="relative w-48 h-48 mb-xl error-glitch-effect flex items-center justify-center">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-3xl"></div>
<div class="z-10 bg-surface-container-high p-xl rounded-xl border border-outline-variant shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[80px] text-error" data-icon="wifi_off" style="font-variation-settings: 'FILL' 1;">wifi_off</span>
</div>
</div>
<!-- Error Message Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">
                Connessione Fallita
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xxl max-w-[280px]">
                Impossibile raggiungere il server. Verifica la tua connessione internet o riprova più tardi.
            </p>
<!-- Action Area -->
<div class="w-full space-y-md">
<button class="w-full bg-primary-container text-on-primary-container h-[48px] rounded-full font-label-lg text-label-lg flex items-center justify-center gap-sm hover:brightness-110 active:scale-[0.98] transition-all" onclick="window.location.reload()">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                    Riprova
                </button>
<button class="w-full border border-outline text-on-surface-variant h-[48px] rounded-full font-label-lg text-label-lg flex items-center justify-center hover:bg-surface-container-low active:scale-[0.98] transition-all">
                    Segnala Problema
                </button>
</div>
<!-- Accessibility Note / System Status -->
<div class="mt-xxl pt-lg border-t border-outline-variant w-full">
<div class="flex items-center justify-center gap-xs text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>
<span class="font-label-md text-label-md">Codice Errore: ERR_CONNECTION_REFUSED</span>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-xl px-gutter flex flex-col items-center gap-md max-w-container-max mx-auto border-t border-outline-variant bg-inverse-surface">
<div class="flex flex-col items-center gap-md">
<span class="font-title-lg text-title-lg text-inverse-on-surface">BlogSpace</span>
<div class="flex flex-wrap justify-center gap-md">
<a class="font-body-md text-body-md text-surface-variant hover:text-primary-fixed-dim underline transition-all" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-surface-variant hover:text-primary-fixed-dim underline transition-all" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-surface-variant hover:text-primary-fixed-dim underline transition-all" href="#">Contact Us</a>
<a class="font-body-md text-body-md text-surface-variant hover:text-primary-fixed-dim underline transition-all" href="#">About</a>
</div>
</div>
<p class="font-body-md text-body-md text-surface-variant mt-md text-center">
            © 2024 BlogSpace Editorial. All rights reserved.
        </p>
</footer>
<script>
        // Micro-interaction for the "Riprova" button
        document.querySelector('button').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Add a temporary spinning animation
            icon.classList.add('animate-spin');
            
            // Simulate a brief delay before "reloading"
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 1000);
        });

        // Atmospheric effect: Subtle cursor following glow
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.bg-primary\\/10');
            if (glow) {
                const rect = glow.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                glow.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px)`;
            }
        });
    </script>
</body></html>
