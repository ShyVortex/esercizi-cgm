<script>
        // Simple micro-interaction for the search bar click
        document.querySelector('.material-symbols-outlined[data-icon="close"]').parentElement.addEventListener('click', () => {
            const input = document.querySelector('input');
            input.value = '';
            input.focus();
        });

        // Nuova Ricerca logic
        document.querySelector('button.bg-primary').addEventListener('click', () => {
            const input = document.querySelector('input');
            input.value = '';
            input.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
