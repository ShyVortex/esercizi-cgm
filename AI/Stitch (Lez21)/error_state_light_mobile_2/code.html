<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar -->

        </div>
<div class="flex items-center gap-base">
<button aria-label="Dark Mode Toggle" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200 cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="dark_mode">dark_mode</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter pt-xxxl pb-xxl">
<div class="w-full max-w-md text-center flex flex-col items-center">
<!-- Error Visual - Bento/Card Pattern -->
<div class="relative mb-xl">
<div class="absolute -inset-4 bg-primary/5 rounded-full blur-2xl animate-pulse"></div>
<div class="relative bg-surface-container-low p-xl rounded-xl shadow-sm border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[80px]" data-icon="cloud_off" style="font-variation-settings: 'wght' 200;">cloud_off</span>
</div>
</div>
<!-- Error Content -->
<h1 class="font-headline-sm text-headline-sm-mobile text-on-surface mb-md">
                Ops! Qualcosa è andato storto
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-[280px] mx-auto">
                Non siamo riusciti a caricare i contenuti. Controlla la connessione.
            </p>
<!-- Primary Action -->
<button class="bg-primary text-on-primary font-label-lg text-label-lg py-md px-xxl rounded-full h-[48px] flex items-center justify-center shadow-md active:scale-95 transition-all duration-200 hover:brightness-110" onclick="window.location.reload()">
                Riprova
            </button>
<!-- Secondary Decorative Element -->
<div class="mt-xxl grid grid-cols-2 gap-md w-full">
<div class="p-md rounded-lg border border-outline-variant bg-surface-container-lowest text-left opacity-60">
<div class="w-8 h-8 rounded-full bg-surface-container-high mb-base animate-pulse"></div>
<div class="h-3 w-3/4 bg-surface-container-high rounded animate-pulse mb-xs"></div>
<div class="h-3 w-1/2 bg-surface-container-high rounded animate-pulse"></div>
</div>
<div class="p-md rounded-lg border border-outline-variant bg-surface-container-lowest text-left opacity-60">

</div>
</div>

        </div>

<script>
        // Simple Interaction logic
        document.querySelector('[aria-label="Dark Mode Toggle"]').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const icon = document.querySelector('[data-icon="dark_mode"]');
            if (document.documentElement.classList.contains('dark')) {
                icon.textContent = 'light_mode';
                icon.setAttribute('data-icon', 'light_mode');
            } else {
                icon.textContent = 'dark_mode';
                icon.setAttribute('data-icon', 'dark_mode');
            }
        });

        // Add a subtle entrance animation for the error state
        window.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main div');
            mainContent.style.opacity = '0';
            mainContent.style.transform = 'translateY(20px)';
            mainContent.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            setTimeout(() => {
                mainContent.style.opacity = '1';
                mainContent.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
